name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q
      - name: Evaluation Gate (offline)
        if: ${{ vars.RUN_EVAL_GATE == 'true' }}
        run: uv run person-agents eval --threshold "${{ vars.EVAL_THRESHOLD || '0.7' }}"
