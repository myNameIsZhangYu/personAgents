services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["serve"]
    env_file:
      - .env
    environment:
      PERSON_AGENTS_DATA_DIR: /data
      PERSON_AGENTS_SQLITE_PATH: /data/memory.db
      PERSON_AGENTS_CHROMA_PATH: /data/chroma
      LANGFUSE_HOST: http://langfuse:3000
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    depends_on:
      langfuse:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["worker"]
    env_file:
      - .env
    environment:
      PERSON_AGENTS_DATA_DIR: /data
      PERSON_AGENTS_SQLITE_PATH: /data/memory.db
      PERSON_AGENTS_CHROMA_PATH: /data/chroma
      LANGFUSE_HOST: http://langfuse:3000
      PERSON_AGENTS_REDIS_URL: redis://redis:6379/0
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:latest
    cap_add:
      - SYS_NICE
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_LISTEN_HOST: "0.0.0.0"
    volumes:
      - langfuse_ch_data:/var/lib/clickhouse
      - ./config/clickhouse/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  langfuse-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse-minio:
    image: chrislusf/seaweedfs:latest
    command: server -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.ip.bind=0.0.0.0 -s3.autoCreateBucket -master.volumeSizeLimitMB=1024 -volume.max=0 -volume.preStopSeconds=10
    environment:
      WEED_S3_ACCESS_KEY: minioadmin
      WEED_S3_SECRET_KEY: minioadmin
    volumes:
      - langfuse_s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9000/ | grep -q ListAllMyBucketsResult"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  langfuse-worker:
    image: langfuse/langfuse-worker:latest
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      SALT: f004ef0fd6841ff3a4c0bc75ba17a94eb7c61873e414c8cd04b61eea9f7bf14e
      ENCRYPTION_KEY: 191e1d74dcf31d0e20332292642f2b40fb944d1095b6fd3c29d59ac217794e89
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      LANGFUSE_MIGRATION_V4_WRITE_MODE: dual

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: 945719b6afabf3d298e71ecc71acdc90f3184708b702b18769c2bb5dd31ea16e
      SALT: f004ef0fd6841ff3a4c0bc75ba17a94eb7c61873e414c8cd04b61eea9f7bf14e
      ENCRYPTION_KEY: 191e1d74dcf31d0e20332292642f2b40fb944d1095b6fd3c29d59ac217794e89
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      LANGFUSE_MIGRATION_V4_WRITE_MODE: dual

volumes:
  app_data:
  langfuse_pg_data:
  langfuse_ch_data:
  langfuse_s3_data:
